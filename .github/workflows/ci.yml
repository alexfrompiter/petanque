name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Отменяем in-flight запуски на ту же ветку/PR при новом пуше.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Android ────────────────────────────────────────────────
  android:
    name: Android · build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Кеш ~/.gradle/caches и ~/.gradle/wrapper между запусками.
          cache-disabled: false

      # `gradle-wrapper.jar` намеренно не закоммичен; генерируем тут.
      - name: Bootstrap Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2 --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: petanque-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/test-results/**
          retention-days: 14

  # ─── iOS ────────────────────────────────────────────────────
  ios:
    name: iOS · build & test
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ios-deriveddata-${{ hashFiles('ios/project.yml', 'ios/Petanque/**/*.swift') }}
          restore-keys: |
            ios-deriveddata-

      # Имя симулятора в каждой версии Xcode своё (iPhone 15/16/17…), поэтому
      # ищем первый доступный iPhone-симулятор по UDID — переживёт любой апдейт
      # раннеров.
      - name: Pick iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Petanque.xcodeproj \
            -scheme Petanque \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -resultBundlePath build/PetanqueTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ios/build/PetanqueTests.xcresult
          retention-days: 14
